name: edumate_pro
description: "EduMate Pro — school management platform connecting teachers, parents and school admin"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  go_router: ^15.1.2
  provider: ^6.1.5+1
  intl: ^0.20.2
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  intl_phone_field: ^3.2.0
  pinput: ^6.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
